version: 2
updates:
  # one grouped PR per ecosystem per week instead of one per dependency
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
    groups:
      go-deps: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci(deps)" }
    groups:
      actions: { patterns: ["*"] }
